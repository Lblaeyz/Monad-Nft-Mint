<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="55%" stop-color="#6D5BD0"/>
      <stop offset="100%" stop-color="#1B1130"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <g opacity="0.25" stroke="#fff" stroke-width="1">
    <circle cx="400" cy="400" r="120" fill="none"/>
    <circle cx="400" cy="400" r="200" fill="none"/>
    <circle cx="400" cy="400" r="280" fill="none"/>
    <circle cx="400" cy="400" r="360" fill="none"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="400" cy="400" r="160" fill="none" stroke="url(#ring)" stroke-width="6"/>
    <polygon points="400,260 540,400 400,540 260,400" fill="#0E0824" stroke="url(#ring)" stroke-width="4"/>
    <text x="400" y="418" text-anchor="middle" font-family="Inter, sans-serif" font-weight="800" font-size="72" fill="#FBBF24">M</text>
  </g>
  <text x="400" y="700" text-anchor="middle" font-family="Inter, sans-serif" font-weight="600" font-size="28" letter-spacing="8" fill="#fff" opacity="0.9">MONAD GENESIS</text>
</svg>
