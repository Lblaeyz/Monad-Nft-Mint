kind = "web"
previewPath = "/"
title = "Monad NFT Mint"
version = "1.0.0"
id = "artifacts/nft-mint"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23291

[services.development]
run = "pnpm --filter @workspace/nft-mint run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nft-mint", "run", "build" ]
publicDir = "artifacts/nft-mint/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23291"
BASE_PATH = "/"
